[server]
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
maxMessageSize = 500
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#123b63"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"
