services:

  # ── 1. Servidor de Tracking MLflow ──────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: sleep-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    networks:
      - sleep-network

  # ── 2. API REST + Dashboard Web Stateless (FastAPI /ui y /docs) ─
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sleep-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./experiments:/app/experiments:ro
      - ./data/processed/meta:/app/data/processed/meta:ro
      - ./kaggle:/app/kaggle
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - HUGGING_FACE_API_KEY=${HUGGING_FACE_API_KEY:-}
      - HF_TOKEN=${HUGGING_FACE_API_KEY:-${HF_TOKEN:-}}
      - HF_DATA_REPO=${HF_DATA_REPO:-maia-grupo25/sleep-edfx-data}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-maia-grupo25/sleep-edfx-models}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - KAGGLE_KERNEL_E0=${KAGGLE_KERNEL_E0:-sleep-edfx-e0-batch}
      - KAGGLE_KERNEL_E1=${KAGGLE_KERNEL_E1:-sleep-edfx-e1-batch}
      - KAGGLE_KERNEL_E2=${KAGGLE_KERNEL_E2:-sleep-edfx-e2-batch}
    depends_on:
      - mlflow
    networks:
      - sleep-network

networks:
  sleep-network:
    driver: bridge
